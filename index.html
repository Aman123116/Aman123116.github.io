<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aman Singh — MIS Executive & Data Analyst</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink: #0e1b1f;
    --paper: #f7f5f0;
    --panel: #ffffff;
    --teal: #1f3a3d;
    --amber: #ff7a30;
    --amber-soft: #ffd9bf;
    --mute: #8a9aa0;
    --line: rgba(14,27,31,0.10);
    --line-dark: rgba(247,245,240,0.10);
    --font-head: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background-image:
      radial-gradient(circle, rgba(14,27,31,0.05) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  ::selection { background: var(--amber); color: var(--ink); }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 2.5rem;
    background: rgba(247,245,240,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav-logo {
    font-family: var(--font-head);
    font-weight: 700; font-size: 1.05rem;
    color: var(--ink); text-decoration: none;
    letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .nav-logo .dot { color: var(--amber); }
  .nav-links { display: flex; gap: 0; list-style: none; align-items: center; }
  .nav-links a {
    font-family: var(--font-mono);
    font-size: 0.74rem; font-weight: 500; letter-spacing: 0.02em;
    text-decoration: none;
    color: var(--mute); transition: color 0.2s;
    padding: 0.4rem 1rem;
    border-left: 1px solid var(--line);
  }
  .nav-links a:first-child { border-left: none; }
  .nav-links a:hover { color: var(--amber); }
  .nav-links a span { color: var(--mute); opacity: 0.5; margin-right: 0.3em; }

  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    padding-top: 4rem;
    position: relative;
    overflow: hidden;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .hero-left {
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 4rem 3rem 4rem 4rem;
    position: relative; z-index: 2;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 0.6rem;
    font-family: var(--font-mono);
    font-size: 0.75rem; font-weight: 500; letter-spacing: 0.02em;
    color: var(--teal);
    margin-bottom: 1.5rem;
    padding: 0.4rem 0.85rem;
    border: 1px solid var(--line);
    border-radius: 100px;
    width: fit-content;
    background: var(--panel);
  }
  .hero-eyebrow .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 0 rgba(255,122,48,0.6);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,122,48,0.55); }
    70% { box-shadow: 0 0 0 6px rgba(255,122,48,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,122,48,0); }
  }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(2.8rem, 5.5vw, 5.2rem);
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 1.5rem;
  }
  h1 .accent { color: var(--amber); position: relative; }
  h1 .role-line {
    display: block; font-size: 0.34em; font-weight: 500;
    font-family: var(--font-mono); letter-spacing: 0.01em;
    color: var(--mute); margin-top: 0.6rem; text-transform: none;
  }

  .hero-desc {
    font-family: var(--font-body);
    font-size: 1.02rem; font-weight: 400; color: var(--teal);
    line-height: 1.75; max-width: 460px; margin-bottom: 2.25rem;
  }
  .hero-ctas { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 2.5rem; }
  .btn-primary {
    background: var(--ink); color: var(--paper);
    padding: 0.9rem 1.85rem; border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.82rem; font-weight: 500; letter-spacing: 0.02em;
    text-decoration: none; transition: background 0.2s, transform 0.15s;
    display: inline-flex; align-items: center; gap: 0.5rem;
    border: 1px solid var(--ink);
  }
  .btn-primary:hover { background: var(--amber); border-color: var(--amber); color: var(--ink); transform: translateY(-2px); }
  .btn-outline {
    border: 1px solid var(--ink); color: var(--ink);
    padding: 0.9rem 1.85rem; border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.82rem; font-weight: 500; letter-spacing: 0.02em;
    text-decoration: none; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: transparent;
  }
  .btn-outline:hover { border-color: var(--amber); color: var(--amber); transform: translateY(-2px); }

  .hero-meta-row {
    display: flex; gap: 2.5rem; flex-wrap: wrap;
    padding-top: 1.75rem; border-top: 1px solid var(--line);
  }
  .hero-meta-item .k {
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--mute); margin-bottom: 0.35rem; display: block;
  }
  .hero-meta-item .v {
    font-family: var(--font-head); font-size: 1.15rem; font-weight: 700; color: var(--ink);
  }

  .hero-right {
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 4rem 3rem 1rem;
    position: relative; z-index: 2;
  }
  .dash-card {
    background: var(--ink);
    border-radius: 6px;
    padding: 0;
    width: 100%; max-width: 380px;
    box-shadow: 0 30px 70px rgba(14,27,31,0.18);
    overflow: hidden;
    animation: floatCard 6s ease-in-out infinite;
  }
  @keyframes floatCard {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(0.3deg); }
  }
  .dash-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 1.1rem;
    border-bottom: 1px solid var(--line-dark);
  }
  .dash-titlebar .name {
    font-family: var(--font-mono); font-size: 0.72rem; color: rgba(247,245,240,0.6); letter-spacing: 0.04em;
  }
  .dash-dots { display: flex; gap: 0.3rem; }
  .dash-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(247,245,240,0.15); }
  .dash-dots span:nth-child(1) { background: var(--amber); }

  .dash-body { padding: 1.6rem; }
  .dash-profile { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1.5rem; }
  .avatar-ring {
    width: 56px; height: 56px; border-radius: 6px;
    background: linear-gradient(135deg, var(--amber), #b94f17);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-size: 1.2rem; font-weight: 700;
    color: var(--ink); flex-shrink: 0;
  }
  .dash-profile h3 {
    font-family: var(--font-head); font-weight: 700; font-size: 1.05rem;
    color: var(--paper); margin-bottom: 0.2rem; letter-spacing: -0.01em;
  }
  .dash-profile .role {
    font-family: var(--font-mono);
    font-size: 0.7rem; color: var(--mute);
  }

  .dash-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1.6rem; }
  .dash-stat {
    background: rgba(247,245,240,0.04); border: 1px solid var(--line-dark);
    border-radius: 4px; padding: 0.9rem;
  }
  .dash-stat .num {
    font-family: var(--font-head); font-size: 1.4rem; font-weight: 700;
    color: var(--paper); display: block; line-height: 1.15; letter-spacing: -0.01em;
  }
  .dash-stat .num .unit { color: var(--amber); font-size: 0.8rem; }
  .dash-stat .label {
    font-family: var(--font-mono);
    font-size: 0.6rem; color: var(--mute); text-transform: uppercase; letter-spacing: 0.07em;
    margin-top: 0.3rem; display: block;
  }

  .dash-bars { display: flex; align-items: flex-end; gap: 0.4rem; height: 64px; padding: 0 0.2rem; }
  .dash-bars .bar {
    flex: 1; background: linear-gradient(180deg, var(--amber), rgba(255,122,48,0.25));
    border-radius: 2px 2px 0 0;
    animation: rise 1.1s ease-out forwards;
    transform-origin: bottom;
  }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .dash-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line-dark);
    font-family: var(--font-mono); font-size: 0.65rem; color: var(--mute); letter-spacing: 0.05em;
  }
  .dash-foot .ok { color: var(--amber); }

  .hero::before, .hero::after {
    content: ''; position: absolute; pointer-events: none;
  }
  .hero::before {
    width: 1px; height: 100%; background: var(--line);
    left: 58%; top: 0;
  }

  section { padding: 5.5rem 4rem; position: relative; z-index: 1; }
  .section-header {
    margin-bottom: 3rem;
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1.5rem;
  }
  .section-tag {
    font-family: var(--font-mono);
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.04em;
    color: var(--amber);
    display: flex; align-items: center; gap: 0.6rem;
  }
  .section-tag .idx { color: var(--mute); }
  h2 {
    font-family: var(--font-head); font-weight: 700;
    font-size: clamp(1.8rem, 3.5vw, 2.7rem);
    letter-spacing: -0.02em; color: var(--ink); line-height: 1.1;
  }
  .section-header-text { display: flex; flex-direction: column; gap: 0.5rem; }

  .skills-section { background: var(--ink); color: var(--paper); }
  .skills-section h2 { color: var(--paper); }
  .skills-section .section-header { border-bottom-color: var(--line-dark); }
  .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-dark); border: 1px solid var(--line-dark); }
  .skill-card {
    background: var(--ink); padding: 1.75rem;
    transition: background 0.2s;
    position: relative;
  }
  .skill-card:hover { background: rgba(255,122,48,0.06); }
  .skill-card .skill-num {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--amber);
    margin-bottom: 1rem; display: block; letter-spacing: 0.05em;
  }
  .skill-card h4 {
    font-family: var(--font-head); font-weight: 700; font-size: 1rem;
    margin-bottom: 0.5rem; color: var(--paper); letter-spacing: -0.01em;
  }
  .skill-card p {
    font-family: var(--font-body);
    font-size: 0.83rem; color: rgba(247,245,240,0.55); line-height: 1.65; margin-bottom: 0.9rem;
  }
  .skill-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .pill {
    font-family: var(--font-mono);
    font-size: 0.65rem; letter-spacing: 0.02em;
    padding: 0.22rem 0.6rem; border-radius: 2px;
    background: rgba(255,122,48,0.1); color: var(--amber-soft);
    border: 1px solid rgba(255,122,48,0.2);
  }

  .exp-section { background: var(--paper); }
  .timeline { display: flex; flex-direction: column; }
  .timeline-item {
    display: grid; grid-template-columns: 160px 1fr;
    gap: 2.5rem; padding: 2rem 0; border-bottom: 1px solid var(--line);
  }
  .timeline-item:last-child { border-bottom: none; }
  .tl-date {
    font-family: var(--font-mono);
    font-size: 0.78rem; font-weight: 500; color: var(--ink);
    letter-spacing: 0.02em; line-height: 1.6;
  }
  .tl-date .status {
    display: inline-flex; align-items: center; gap: 0.4rem;
    margin-top: 0.5rem; color: var(--amber); font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .tl-date .status::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
    animation: pulse 2.2s infinite;
  }
  .tl-content h3 {
    font-family: var(--font-head); font-weight: 700; font-size: 1.3rem;
    margin-bottom: 0.3rem; letter-spacing: -0.01em;
  }
  .tl-company {
    font-family: var(--font-mono);
    font-size: 0.8rem; color: var(--teal); font-weight: 500; margin-bottom: 1.25rem;
  }
  .tl-content ul { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
  .tl-content li {
    font-family: var(--font-body);
    font-size: 0.92rem; color: var(--teal); line-height: 1.65;
    padding-left: 1.4rem; position: relative;
  }
  .tl-content li::before {
    content: '▸'; position: absolute; left: 0; color: var(--amber); font-size: 0.85rem;
  }

  .projects-section { background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
  .project-card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 6px; padding: 2rem; position: relative; overflow: hidden;
    transition: box-shadow 0.25s, transform 0.25s, border-color 0.25s;
  }
  .project-card:hover { box-shadow: 0 16px 40px rgba(14,27,31,0.1); transform: translateY(-4px); border-color: var(--amber); }
  .proj-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.25rem; }
  .proj-tools { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .proj-tool {
    font-family: var(--font-mono);
    font-size: 0.65rem; letter-spacing: 0.02em;
    padding: 0.22rem 0.6rem; border-radius: 2px; font-weight: 500;
    background: var(--teal); color: var(--paper);
  }
  .proj-date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--mute); }
  .project-card h3 {
    font-family: var(--font-head); font-weight: 700; font-size: 1.2rem;
    margin-bottom: 0.85rem; letter-spacing: -0.01em;
  }
  .project-card ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .project-card li {
    font-family: var(--font-body);
    font-size: 0.87rem; color: var(--teal); padding-left: 1.1rem; position: relative; line-height: 1.6;
  }
  .project-card li::before { content: '▸'; position: absolute; left: 0; color: var(--amber); }

  .certs-section { background: var(--ink); }
  .certs-section h2 { color: var(--paper); }
  .certs-section .section-header { border-bottom-color: var(--line-dark); }
  .certs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1px; background: var(--line-dark); border: 1px solid var(--line-dark); }
  .cert-card {
    background: var(--ink); padding: 1.4rem;
    display: flex; align-items: center; gap: 1rem;
    transition: background 0.2s;
  }
  .cert-card:hover { background: rgba(255,122,48,0.06); }
  .cert-tag {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--amber);
    flex-shrink: 0; width: 2.2rem;
  }
  .cert-info h4 {
    font-family: var(--font-head); font-weight: 600; font-size: 0.88rem;
    color: var(--paper); margin-bottom: 0.25rem; line-height: 1.35; letter-spacing: -0.005em;
  }
  .cert-info p {
    font-family: var(--font-mono);
    font-size: 0.68rem; color: var(--mute); font-weight: 400; letter-spacing: 0.02em;
  }

  .edu-section { background: var(--paper); }
  .edu-grid { display: flex; flex-direction: column; }
  .edu-row {
    display: grid; grid-template-columns: 140px 1fr 200px;
    gap: 1.5rem; align-items: center;
    padding: 1.5rem 0; border-bottom: 1px solid var(--line);
  }
  .edu-row:last-child { border-bottom: none; }
  .edu-year {
    font-family: var(--font-mono);
    font-size: 0.78rem; font-weight: 500; color: var(--amber);
  }
  .edu-row h4 {
    font-family: var(--font-head); font-weight: 700; font-size: 1.05rem;
    letter-spacing: -0.01em;
  }
  .edu-row p { font-family: var(--font-mono); font-size: 0.78rem; color: var(--mute); line-height: 1.5; text-align: right; }

  .contact-section {
    background: var(--teal); color: var(--paper);
    text-align: center; padding: 6rem 2rem;
    position: relative; overflow: hidden;
  }
  .contact-section .section-tag { color: var(--amber-soft); justify-content: center; }
  .contact-section h2 { color: var(--paper); margin: 1rem 0 1rem; }
  .contact-section p {
    font-family: var(--font-body);
    color: rgba(247,245,240,0.65); max-width: 480px;
    margin: 0 auto 2.25rem; font-size: 0.98rem; line-height: 1.75;
  }
  .contact-links { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; }
  .contact-btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.85rem 1.6rem; border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 0.8rem; font-weight: 500; text-decoration: none; transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .contact-btn.primary { background: var(--amber); color: var(--ink); border: 1px solid var(--amber); }
  .contact-btn.primary:hover { background: var(--paper); border-color: var(--paper); }
  .contact-btn.ghost { border: 1px solid rgba(247,245,240,0.25); color: var(--paper); }
  .contact-btn.ghost:hover { border-color: var(--amber-soft); color: var(--amber-soft); }

  .contact-meta {
    margin-top: 1.75rem !important;
    font-family: var(--font-mono) !important;
    font-size: 0.76rem !important;
    color: rgba(247,245,240,0.4) !important;
    position: relative;
  }
  .copy-toast {
    position: absolute; left: 50%; bottom: -2.2rem; transform: translateX(-50%) translateY(8px);
    background: var(--amber); color: var(--ink);
    font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600;
    padding: 0.35rem 0.9rem; border-radius: 3px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
  }
  .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .mobile-jumpbar { display: none; }

  footer {
    background: var(--ink); padding: 1.5rem 2.5rem;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.72rem; color: rgba(247,245,240,0.35);
    letter-spacing: 0.02em;
  }
  footer .foot-name {
    font-family: var(--font-head); font-weight: 700;
    color: rgba(247,245,240,0.7); font-size: 0.9rem; letter-spacing: -0.01em;
  }

  .fade-up { opacity: 0; transform: translateY(20px); animation: fadeUp 0.6s ease forwards; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.22s; }
  .delay-3 { animation-delay: 0.34s; }
  .delay-4 { animation-delay: 0.46s; }

  @media (max-width: 768px) {
    body { padding-bottom: 52px; background-size: 16px 16px; }
    nav { padding: 0.9rem 1.25rem; }
    .nav-links { display: none; }

    .mobile-jumpbar {
      display: flex;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 99;
      background: var(--ink);
      border-top: 1px solid var(--line-dark);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0.6rem 0.75rem;
      gap: 0.5rem;
    }
    .mobile-jumpbar::-webkit-scrollbar { display: none; }
    .mobile-jumpbar a {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.02em;
      text-decoration: none;
      color: rgba(247,245,240,0.6);
      background: rgba(255,122,48,0.08);
      border: 1px solid rgba(255,122,48,0.18);
      padding: 0.45rem 0.9rem; border-radius: 3px;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .mobile-jumpbar a.active {
      background: var(--amber);
      color: var(--ink);
      border-color: var(--amber);
    }

    .hero {
      grid-template-columns: 1fr;
      min-height: auto;
      padding-top: 4rem;
    }
    .hero::before { display: none; }
    .hero-left { padding: 2.5rem 1.25rem 2rem; justify-content: flex-start; }
    h1 { font-size:
